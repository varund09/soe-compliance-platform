name: SOE Compliance Check

on:
  push:
    branches: [ "main" ]

jobs:
  run-compliance:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell compliance script
        shell: pwsh
        run: ./scripts/compliance_check.ps1

      - name: Upload compliance result
        uses: actions/upload-artifact@v4
        with:
          name: compliance-result
          path: output/compliance_result.json
